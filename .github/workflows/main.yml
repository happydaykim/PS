name: CI and Sync to Organizer

on:
  push:
    branches: [ "main" ]

jobs:
  ci-sync:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 내 레포 체크아웃
      - name: Checkout my repository
        uses: actions/checkout@v4

      # 2️⃣ SSH 설정 (Deploy Key)
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORGANIZER_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          
      - name: Setup whoami
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          
      - name: Sync to organizer repository
        env:
          ORG_REPO: git@github.com:SKALA-Cloud-team-2/algorithm-study.git
          USERNAME: ${{ github.actor }}
        run: |
          # 변수 설정
          BRANCH="user/$USERNAME"

          # 대상 레포지토리 클론
          git clone $ORG_REPO algorithm-study
          cd algorithm-study

          # 👇 [변경됨] 브랜치 처리 로직 시작
          git fetch origin

          # remote branch로 이동 없으면 복사
          if git show-ref --verify --quiet refs/remotes/origin/$BRANCH; then
            echo "Branch $BRANCH exists on remote. Checking out..."
            # origin에 존재하면 그 브랜치를 그대로 가져옴
            git checkout -B $BRANCH origin/$BRANCH
          else
            echo "Branch $BRANCH does not exist. Creating from main..."
            # origin에 없으면 main 기준으로 새 브랜치 생성
            git checkout -B $BRANCH main
            git push -u origin $BRANCH
          fi
          # 👆 [변경됨] 브랜치 처리 로직 끝

          # 내 풀이 복사 준비
          mkdir -p solutions/$USERNAME
          
          # [전체 동기화 설정] - 기존 로직 유지
          rsync -av --delete \
            --exclude='.*' \
            --exclude='algorithm-study' \
            $GITHUB_WORKSPACE/ \
            solutions/$USERNAME/

          git add solutions/$USERNAME

          # 변경사항이 없으면 성공(exit 0) 처리
          git commit -m "sync: update solutions from $USERNAME" || exit 0
          
          # 👇 [수정됨] --force 제거 (기존 브랜치 이력을 기반으로 커밋하므로 일반 푸시 사용)
          git push origin $BRANCH
